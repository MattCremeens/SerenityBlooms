<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{% block description %}{{ business.name }} — {{ business.tagline }}{% endblock %}">
  <title>{% block title %}{{ business.name }} | Fresh Local Flowers{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css?v=16">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="nav-logo" href="/">{{ business.name }}</a>
      <ul class="nav-links">
        <li><a href="/#about">About</a></li>
        <li><a href="/#shop">Shop</a></li>
        <li><a href="/#flowers">Flowers</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="top">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; {{ business.name }}. All rights reserved.</p>
      <p class="footer-note">Fresh flowers, local markets — see you soon.</p>
    </div>
  </footer>
</body>
</html>
